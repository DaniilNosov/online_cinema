services:
  db:
    image: postgres:16-alpine
    container_name: cinema_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cinema_redis
    restart: always
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cinema_mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: pgsty/minio:latest
    container_name: cinema_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: .
    container_name: cinema_backend
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      SMTP_HOST: mailhog
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mailhog
      - minio

  celery_worker:
    build: .
    container_name: cinema_celery_worker
    restart: always
    command: celery -A src.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      SMTP_HOST: mailhog
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: cinema_celery_beat
    restart: always
    command: celery -A src.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      SMTP_HOST: mailhog
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  minio_data:
