[project]
name = "online-cinema-project"
version = "0.1.0"
description = "Online Cinema API"
authors = [
    {name = "Daniil Nosov", email = "nosov281@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.143.2,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic[email] (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "boto3 (>=1.43.114,<2.0.0)",
    "stripe (>=16.0.0,<17.0.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "botocore (>=1.43.114,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "cryptography (>=50.0.2,<51.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
